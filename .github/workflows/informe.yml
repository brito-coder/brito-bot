name: Informe semanal
on:
  schedule:
    - cron: '0 12 * * 1'   # lunes 9:00 de Mendoza
  workflow_dispatch: {}
concurrency:
  group: brito-bot-manual
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Métricas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node metricas.mjs
      - name: Guardar y avisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOY=$(date -u +%F)
          git config user.name "brito-bot"
          git config user.email "brito-bot@users.noreply.github.com"
          git add informes estado
          git diff --cached --quiet || git commit -m "informe semanal $HOY"
          for i in 1 2 3; do git pull --rebase --autostash --quiet && git push --quiet && break; sleep 5; done
          gh issue create --title "📊 Informe semanal $HOY" --body-file "informes/$HOY.md"
