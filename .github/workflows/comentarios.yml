name: brito-bot (cola, clientes, comentarios y votos)
on:
  schedule:
    - cron: '*/20 * * * *'   # GitHub lo arranca más o menos cada hora; cada arranque trabaja ~55 min
  workflow_dispatch: {}
concurrency:
  group: brito-bot-ciclo
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bot (vueltas cada 5 minutos)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "brito-bot"
          git config user.email "brito-bot@users.noreply.github.com"
          node ciclo.mjs --loop
